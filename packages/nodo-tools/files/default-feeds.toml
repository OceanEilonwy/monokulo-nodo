# Feeds every device starts with, installed as /usr/share/nodo/default-feeds.toml. None: each app
# publishes its own feed from its own repository's releases, and the owner adds the feeds they
# want by hand (Sources), comparing the key the app names (docs/FEED.md, "App feeds").
#
# A feed listed here would be added the first time nodo-helper reads its feed state on a device
# that never had it, pinned to the fingerprint here: there is no trust on first use, the device
# never asks the server which key to trust. A feed the owner removed stays removed, and changing a
# fingerprint here never replaces a pin a device already has. Each entry is:
#
#   [[feed]]
#   name = "<name>"
#   address = "https://..."
#   fingerprint = "<the key as xbps shows it: MD5 of the key in SSH form, ssh-keygen -l -E md5>"
