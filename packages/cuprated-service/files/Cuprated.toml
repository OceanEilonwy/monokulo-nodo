# Unset values use cuprated's defaults: https://user.cuprate.org/config.html
network = "Mainnet"
fast_sync = true

[tracing.file]
level = "info"
max_log_files = 3

[p2p.clear_net]
enable_inbound = true
listen_on = "0.0.0.0"
enable_inbound_v6 = false
outbound_connections = 32
max_inbound_connections = 64

# RPC is restricted and on loopback only: wallets, apps and the helper on this device use it,
# and nothing on the network can. The unrestricted server, with stop_daemon and the like, is off.
# The firewall opens only the P2P port, so these must stay on loopback (cuprated.nft).
[rpc.unrestricted]
enable = false

[rpc.restricted]
address = "127.0.0.1"
port = 18081
enable = true
advertise = false

[fs]
fast_data_directory = "/var/lib/cuprated"
slow_data_directory = "/var/lib/cuprated"
cache_directory = "/var/lib/cuprated/cache"
