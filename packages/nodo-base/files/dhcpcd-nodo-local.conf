# nodo-localnet: the second LAN address for local sites, leased on its own macvlan interface.
# Only the address is used. The main interface alone decides how the device reaches the network,
# so this lease brings no default or static routes, DNS servers, search domain, hostname or MTU,
# and there is no 169.254 fallback. dhcpcd does no IPv6 here, and nodo-localnet switches IPv6
# off on the interface. Its subnet route ranks below the main interface's.
interface nodo-local
	ipv4only
	noipv4ll
	nogateway
	metric 4000
	nooption domain_name_servers, domain_name, domain_search, host_name, interface_mtu
	nooption static_routes, classless_static_routes, ntp_servers
	nohook resolv.conf
	nohook hostname
	nohook ntp.conf
