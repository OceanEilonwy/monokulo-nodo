[package]
name = "nodo-screen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "nodo-screen"
path = "src/main.rs"

[dependencies]
nodo-panels = { path = "../nodo-panels" }
nodo-manifest = { path = "../nodo-manifest" }
nodo-power = { path = "../nodo-power" }
serde.workspace = true
toml.workspace = true
# The same terminal stack as nodo-tui.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
signal-hook = { version = "0.3", default-features = false }
libc = "0.2"
