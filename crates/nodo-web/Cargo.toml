[package]
name = "nodo-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Caddy, Tor and firewall config generation, plus dynamic DNS, for monokulo-nodo sites"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nodo-ddns"
path = "src/bin/nodo-ddns.rs"

[dependencies]
nodo-api = { path = "../nodo-api" }
nodo-manifest = { path = "../nodo-manifest" }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
toml.workspace = true
base64 = "0.23"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
# Used only by the binary's HttpClient. The library takes an injected client, so tests cannot reach the network.
ureq = { version = "3", default-features = false, features = ["rustls"] }
