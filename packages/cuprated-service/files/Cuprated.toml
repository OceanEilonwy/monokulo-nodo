# Unset values use cuprated's defaults: https://user.cuprate.org/config.html
network = "Mainnet"
fast_sync = true

[tracing.file]
level = "info"
max_log_files = 3

[p2p.clear_net]
enable_inbound = true
listen_on = "0.0.0.0"
enable_inbound_v6 = false
outbound_connections = 32
max_inbound_connections = 64

[rpc.unrestricted]
address = "127.0.0.1"
enable = true

[rpc.restricted]
address = "0.0.0.0"
port = 18089
enable = false

[fs]
fast_data_directory = "/var/lib/cuprated"
slow_data_directory = "/var/lib/cuprated"
cache_directory = "/var/lib/cuprated/cache"
