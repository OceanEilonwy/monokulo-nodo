[package]
name = "nodo-install"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
nodo-feed = { path = "../nodo-feed" }
nodo-manifest = { path = "../nodo-manifest" }
serde.workspace = true
sha2 = "0.10"
thiserror.workspace = true
toml.workspace = true
# Feed downloads. The same client and TLS stack as nodo-ddns, with the system certificate bundle.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
nodo-settings = { path = "../nodo-settings" }
tempfile = "3"
