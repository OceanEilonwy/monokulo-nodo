# Builds an app's xbps packages from a release tag of its own repository, signs them into the app's
# own feed and attaches that feed to the tag's GitHub release. The newest release is the feed:
#
#   https://github.com/<owner>/<repo>/releases/latest/download
#
# which an owner adds on their device by hand (Sources), confirming the key the app's nodo/README.md
# names. The app's repository calls this workflow, so it runs there, with that repository's token,
# caches and key:
#
#   jobs:
#     nodo:
#       permissions:
#         contents: write
#       uses: OceanEilonwy/monokulo-nodo/.github/workflows/app-release.yml@main
#       with:
#         packages: mk-lws
#         tag: ${{ github.ref_name }}
#       secrets: inherit
#
# The app keeps each recipe in nodo/<package> (template and files/) and the tests of its files in
# nodo/tests/<crate>/*.rs, run against this repository's crates of that name, and its feed's public
# key in nodo/feed-signing-key.pub.pem (on its default branch). Its releases name its versions:
# v1.2.0 is package version 1.2.0. docs/FEED.md, "App feeds", describes the whole flow;
# scripts/app-release.sh does the work.
#
#   prepare  pin each recipe to the tag (scripts/app-release.sh pin), refuse a version that is not
#            newer than the app's earlier releases carry, and run the app's tests
#   build    the packages for each architecture with scripts/build-packages.sh
#   release  run each package through the device's own install review in a throwaway feed; then
#            sign the feed with the app's key (its NODO_FEED_SIGNING_KEY secret, in that one step
#            only), check it against nodo/feed-signing-key.pub.pem, attach it to the tag's
#            release (creating the release if the tag has none), and read it back from GitHub as
#            a device would
name: app release

on:
  workflow_call:
    inputs:
      packages:
        description: The recipes in the app's nodo/ to build, separated by spaces
        required: true
        type: string
      tag:
        description: The release tag to build, such as v1.2.0
        required: true
        type: string
      nodo-ref:
        description: The monokulo-nodo ref whose scripts and builder build it
        required: false
        type: string
        default: main
    secrets:
      NODO_FEED_SIGNING_KEY:
        description: The app feed's RSA private key, PEM; its public half is nodo/feed-signing-key.pub.pem
        required: true

permissions:
  contents: read

env:
  PACKAGES: ${{ inputs.packages }}
  TAG: ${{ inputs.tag }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check the inputs
        run: |
          case $PACKAGES in *[!a-z0-9\ ._-]* | '') echo "::error::bad packages: $PACKAGES"; exit 1 ;; esac
          case $TAG in *[!A-Za-z0-9._-]* | '') echo "::error::bad tag: $TAG"; exit 1 ;; esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: app
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OceanEilonwy/monokulo-nodo
          ref: ${{ inputs.nodo-ref }}
          path: nodo
          persist-credentials: false

      - name: Pin the recipes to the tag
        working-directory: nodo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2086 # one word per package
          scripts/app-release.sh pin "$GITHUB_WORKSPACE/app" "$GITHUB_REPOSITORY" "$TAG" $PACKAGES
          # shellcheck disable=SC2086
          scripts/app-release.sh newer "$GITHUB_REPOSITORY" "$TAG" $PACKAGES

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nodo/target
          key: nodo-app-test-${{ hashFiles('nodo/Cargo.lock') }}
          restore-keys: nodo-app-test-

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Test the app's files against the device's code
        working-directory: nodo
        run: scripts/app-release.sh test

      - name: Keep the pinned recipes
        working-directory: nodo
        run: |
          set --
          for p in $PACKAGES; do set -- "$@" "packages/$p"; done
          tar -cf "$RUNNER_TEMP/recipes.tar" "$@"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodo-recipes
          path: ${{ runner.temp }}/recipes.tar
          retention-days: 7
          if-no-files-found: error

  build:
    name: build ${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # The runner is x86_64: x86_64 builds natively, aarch64 cross-compiles.
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OceanEilonwy/monokulo-nodo
          ref: ${{ inputs.nodo-ref }}
          path: nodo
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nodo-recipes
          path: ${{ runner.temp }}

      - name: Place the pinned recipes
        run: tar -C nodo -xf "$RUNNER_TEMP/recipes.tar"

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # As system.yml's: distfiles, cargo and npm downloads and xbps's package cache, then the
      # compiler caches, then the builder image. They live in the app's repository.
      - name: Restore the build cache
        id: hostdir
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nodo/build/hostdir
            !nodo/build/hostdir/sccache
            !nodo/build/hostdir/ccache
          key: nodo-hostdir-${{ matrix.arch }}-${{ hashFiles('nodo/packages/**', 'nodo/versions.env') }}
          restore-keys: nodo-hostdir-${{ matrix.arch }}-

      - name: Restore the compiler caches
        id: compile
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nodo/build/hostdir/sccache
            nodo/build/hostdir/ccache
          key: nodo-compile-${{ matrix.arch }}-${{ hashFiles('nodo/packages/**', 'nodo/versions.env', 'nodo/scripts/_build-packages-inner.sh', 'nodo/scripts/_xbps-src-sccache.sh') }}
          restore-keys: nodo-compile-${{ matrix.arch }}-

      - name: Restore the builder image
        id: builder
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nodo/build/builder-image.tar.zst
          key: nodo-builder-${{ hashFiles('nodo/docker/builder.Dockerfile', 'nodo/versions.env') }}

      - name: Load the builder image
        if: steps.builder.outputs.cache-hit == 'true'
        run: zstd -dc nodo/build/builder-image.tar.zst | docker load

      - name: Build
        id: build
        working-directory: nodo
        env:
          SCCACHE_CACHE_SIZE: 1536M
          CCACHE_MAXSIZE: 256M
        run: |
          # shellcheck disable=SC2086 # one word per package
          scripts/build-packages.sh "${{ matrix.arch }}" $PACKAGES

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.build.outcome != 'skipped' && steps.compile.outputs.cache-hit != 'true'
        with:
          path: |
            nodo/build/hostdir/sccache
            nodo/build/hostdir/ccache
          key: ${{ steps.compile.outputs.cache-primary-key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the builder image
        if: steps.builder.outputs.cache-hit != 'true'
        working-directory: nodo
        # lib.sh finds the repository from $0, so it runs with scripts/lib.sh as $0.
        run: |
          set -o pipefail
          # shellcheck disable=SC2016
          bash -c '. scripts/lib.sh && docker save "$(builder_tag)"' scripts/lib.sh | zstd -T0 -3 -o build/builder-image.tar.zst

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.builder.outputs.cache-hit != 'true'
        with:
          path: nodo/build/builder-image.tar.zst
          key: ${{ steps.builder.outputs.cache-primary-key }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.hostdir.outputs.cache-hit != 'true'
        with:
          path: |
            nodo/build/hostdir
            !nodo/build/hostdir/sccache
            !nodo/build/hostdir/ccache
          key: ${{ steps.hostdir.outputs.cache-primary-key }}

      # GitHub Pages, where the feed publishes them, refuses files over 100 MB.
      - name: Collect the packages
        run: |
          mkdir -p "out/${{ matrix.arch }}"
          for p in $PACKAGES; do
            cp "nodo/out/feed/${{ matrix.arch }}/$p"-[0-9]*.xbps "out/${{ matrix.arch }}/"
          done
          ls -l "out/${{ matrix.arch }}"
          big=$(find out -type f -size +95M)
          if [ -n "$big" ]; then echo "::error::over the Pages file limit: $big"; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodo-xbps-${{ matrix.arch }}
          path: out/${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error

  release:
    # Both architectures or nothing: devices of either would otherwise see the app in one and not
    # the other.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OceanEilonwy/monokulo-nodo
          ref: ${{ inputs.nodo-ref }}
          path: nodo
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nodo-xbps-*
          path: artifacts

      - name: Place the packages
        run: |
          for arch in aarch64 x86_64; do
            mkdir -p "nodo/out/feed/$arch"
            cp "artifacts/nodo-xbps-$arch"/*.xbps "nodo/out/feed/$arch/"
          done

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nodo/target
          key: nodo-app-test-${{ hashFiles('nodo/Cargo.lock') }}
          restore-keys: nodo-app-test-

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check as a device would
        working-directory: nodo
        run: |
          # shellcheck disable=SC2086 # one word per package
          scripts/app-release.sh check $PACKAGES -- aarch64 x86_64

      # The key's public half from the app's default branch: which key signs the app's feed is the
      # repository's, not any one tag's.
      - name: Read the feed's public key
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/nodo/feed-signing-key.pub.pem" -q .content | base64 -d > "$RUNNER_TEMP/feed-key.pub.pem"
          ssh-keygen -i -m PKCS8 -f "$RUNNER_TEMP/feed-key.pub.pem" > "$RUNNER_TEMP/feed-key.ssh"
          fp=$(ssh-keygen -l -E md5 -f "$RUNNER_TEMP/feed-key.ssh" | sed -n 's/^[0-9]* MD5:\([0-9a-f:]*\) .*/\1/p')
          [ -n "$fp" ] || { echo "::error::nodo/feed-signing-key.pub.pem is not an RSA public key"; exit 1; }
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          echo "the feed's key: $fp"

      # The key exists only in this step, in a 0600 file under the runner's temp directory, and
      # reaches xbps-rindex read-only in a container without network.
      - name: Sign the feed
        working-directory: nodo
        env:
          NODO_FEED_SIGNING_KEY: ${{ secrets.NODO_FEED_SIGNING_KEY }}
          FEED_SITE: ${{ github.workspace }}/site
        run: |
          [ -n "$NODO_FEED_SIGNING_KEY" ] || { echo "::error::set the NODO_FEED_SIGNING_KEY secret (nodo/README.md)"; exit 1; }
          # shellcheck disable=SC2086 # one line per package
          printf '%s\n' $PACKAGES > "$RUNNER_TEMP/packages"
          umask 077
          key=$(mktemp "$RUNNER_TEMP/feed-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$NODO_FEED_SIGNING_KEY" > "$key"
          FEED_PACKAGES="$RUNNER_TEMP/packages" FEED_SIGNER="${GITHUB_REPOSITORY#*/} feed" \
            scripts/publish-feed.sh sign "$key" aarch64 x86_64

      - name: Check the signed feed against the app's key
        working-directory: nodo
        env:
          FEED_SITE: ${{ github.workspace }}/site
          FEED_FINGERPRINT: ${{ steps.key.outputs.fingerprint }}
        run: FEED_PACKAGES="$RUNNER_TEMP/packages" scripts/publish-feed.sh check aarch64 x86_64

      - name: Attach the feed to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes "Includes this app's monokulo-nodo feed: see nodo/README.md to add it to a device."
          fi
          gh release upload "$TAG" site/feed/* --repo "$GITHUB_REPOSITORY" --clobber

      # From the tag's own download address, which the latest one points to once this release is
      # the newest: through GitHub's redirect to its storage host, exactly as a device reads it.
      - name: Read the feed back as a device would
        working-directory: nodo
        env:
          FINGERPRINT: ${{ steps.key.outputs.fingerprint }}
        run: |
          address="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for arch in aarch64 x86_64; do
            cargo run -q --release -p nodo-install --example check-feed -- "$address" "$arch" "$FINGERPRINT"
          done
          {
            echo "## monokulo-nodo feed"
            echo
            echo "Add on a device (Sources): \`https://github.com/$GITHUB_REPOSITORY/releases/latest/download\`, key \`$FINGERPRINT\`."
            echo
            for f in ../site/feed/*.xbps; do echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"; done
          } >> "$GITHUB_STEP_SUMMARY"
