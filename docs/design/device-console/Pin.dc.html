<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nodo device — Screen PIN</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.dev{width:960px;height:540px;background:#000;color:#f2f2f2;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;gap:40px;padding:40px 56px;overflow:hidden;box-sizing:border-box}
.s{font-size:18px;color:#b3b3b3;line-height:26px}
.dots{display:flex;gap:16px}
.d{width:26px;height:26px;border-radius:13px;box-shadow:inset 0 0 0 3px #5c5c5c}
.d.on{background:#ff6600;box-shadow:none}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:400px;flex:0 0 400px}
.k{height:92px;border-radius:20px;background:#1c1c1c;color:#f2f2f2;border:0;font:600 36px "JetBrains Mono",monospace;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;text-decoration:none}
.k:active{background:#4c4c4c}
.k.fn{background:#0d0d0d;font:600 20px Inter,system-ui,sans-serif;color:#d9d9d9}
.k svg{width:32px;height:32px}
</style>
</helmet>
<div class="dev">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 18px">
<img src="logo.svg" alt="" width="64" height="64">
<h1 style="margin: 0; font-size: 36px; line-height: 42px; font-weight: 700">Enter the screen PIN</h1>
<div class="s">to reset the web password</div>
<div class="dots" role="img" aria-label="{{filled}} of 6 digits entered">
<sc-for list="{{dots}}" as="dot" hint-placeholder-count="6"><span class="{{dot.cls}}"></span></sc-for>
</div>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}"><a href="Reset.dc.html" style="align-self: flex-start; height: 56px; padding: 0 28px; border-radius: 16px; background: #ff6600; color: #000000; font-size: 18px; font-weight: 600; display: inline-flex; align-items: center">Reset the web password</a></sc-if>
<div class="s" style="font-size: 15px; margin-top: 8px">The PIN guards changes made on this screen. It is not the device passphrase.</div>
</div>
<div class="pad">
<sc-for list="{{digits}}" as="n" hint-placeholder-count="9">
<button class="k" type="button" onClick="{{n.press}}">{{n.label}}</button>
</sc-for>
<a class="k fn" href="System.dc.html">Cancel</a>
<button class="k" type="button" onClick="{{zero}}">0</button>
<button class="k fn" type="button" aria-label="Delete" onClick="{{back}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"></path><path d="M17 9l-6 6"></path><path d="M11 9l6 6"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { n: 4 };
}
renderVals() {
const n = this.state.n;
const add = () => this.setState({ n: Math.min(6, n + 1) });
const dots = [0, 1, 2, 3, 4, 5].map((i) => ({ cls: i < n ? 'd on' : 'd' }));
const digits = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => ({ label: String(d), press: add }));
return {
dots: dots, digits: digits, filled: n, zero: add, done: n === 6,
back: () => this.setState({ n: Math.max(0, n - 1) })
};
}
}
</script>
</body>
</html>
