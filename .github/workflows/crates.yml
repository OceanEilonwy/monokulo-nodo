# Runs the host-side Rust tests of the crates the TUI and the helper are built from, on every pull
# request and push that changes them. The image and snapshot builds in system.yml only run when
# packages change, so without this a change to crates/ reached main untested.
name: crates

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/crates.yml
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/crates.yml

permissions:
  contents: read

concurrency:
  group: crates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - name: Test nodo-api, nodo-helper, nodo-tui, nodo-ui-core and nodo-web-gui
        run: cargo test --locked -p nodo-api -p nodo-helper -p nodo-tui -p nodo-ui-core -p nodo-web-gui

      # Only these rules, not the whole of clippy. Reading the terminal anywhere but nodo_tui::input
      # brings back a TUI that spins after a hangup. A result dropped with `let _ =` or as a bare
      # statement is how Check now and the source actions failed without a word; one that is right
      # to drop says why next to an #[allow].
      - name: nodo-tui reads its terminal only through nodo_tui::input, and drops no result unsaid
        run: >-
          cargo clippy --locked -p nodo-tui --all-targets --
          -A clippy::all -D clippy::disallowed_methods -D clippy::let_underscore_must_use -D unused_must_use

      # The same rules for what the interfaces share: the helper calls are made there.
      - name: nodo-ui-core never reads a terminal, and drops no result unsaid
        run: >-
          cargo clippy --locked -p nodo-ui-core --all-targets --
          -A clippy::all -D clippy::disallowed_methods -D clippy::let_underscore_must_use -D unused_must_use

      # And for the web GUI, where a dropped result would be a click that failed without a word.
      - name: nodo-web-gui drops no result unsaid
        run: >-
          cargo clippy --locked -p nodo-web-gui --all-targets --
          -A clippy::all -D clippy::let_underscore_must_use -D unused_must_use
