[package]
name = "nodo-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "nodo-tui"
path = "src/main.rs"

[dependencies]
nodo-api = { path = "../nodo-api" }
# ratatui 0.29 pinned unicode-width to 0.2.0, which Slint (nodo-gui) cannot share.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
signal-hook = { version = "0.3", default-features = false }
unicode-width = "0.2"
zeroize = "1"
