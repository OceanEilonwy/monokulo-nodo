[package]
name = "nodo-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "nodo-tui"
path = "src/main.rs"

[dependencies]
nodo-api = { path = "../nodo-api" }
# ratatui 0.29 pinned unicode-width to 0.2.0, which Slint (nodo-gui) cannot share.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# use-dev-tty: crossterm's default (mio) input source spins forever on a hung-up terminal
# (crossterm-rs/crossterm#793); this one gives up when its timeout runs out. See src/input.rs.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
libc = "0.2"
signal-hook = { version = "0.3", default-features = false }
unicode-width = "0.2"
zeroize = "1"
# QR codes on setup pages, drawn with half blocks. MIT, no dependencies.
qrcodegen = "1.8"
