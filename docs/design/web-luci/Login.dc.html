<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nodo — Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.root{min-height:100vh;background:#eef0f3;color:#1d2125;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:#0a5fc2;text-decoration:none}a:hover{color:#08498f;text-decoration:underline}
.hdr{background:#1f2328;color:#e6e8eb;display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;padding:0 20px;min-height:48px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:#fff;margin-right:16px}
.brand:hover{color:#fff;text-decoration:none}
.brand i{width:12px;height:12px;background:#f2a33a;display:inline-block;border-radius:2px}
.wrap{max-width:640px;margin:0 auto;padding:48px 20px 8px}
h2{font-size:22px;margin:0 0 4px;font-weight:600}
.desc{color:#5b6570;margin:0 0 16px}
.sec{background:#fff;border:1px solid #d5d9de;border-radius:3px;margin-bottom:16px}
.sec h3{font-size:15px;margin:0;padding:10px 14px;border-bottom:1px solid #e3e6ea;background:#f7f8fa;font-weight:600}
.sec .body{padding:4px 14px}
.row{display:flex;flex-wrap:wrap;gap:6px 20px;padding:14px 0}
.row>label{flex:0 0 170px;text-align:right;font-weight:500;color:#3b444d;padding-top:6px}
.row .fld{flex:1 1 260px;min-width:0}
input[type=password]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid #b8bfc7;border-radius:3px;background:#fff;min-height:36px;box-sizing:border-box;width:100%;color:#1d2125}
.hint{font-size:12px;color:#5b6570;margin-top:6px}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid #e3e6ea;background:#f7f8fa}
.btn{font:inherit;font-size:13px;font-weight:500;padding:5px 16px;min-height:36px;border-radius:3px;border:1px solid #b8bfc7;background:#fff;color:#1d2125;cursor:pointer}
.btn.apply{background:#0a5fc2;border-color:#0a5fc2;color:#fff}
.btn.apply:hover{background:#08498f}
.note{color:#5b6570;font-size:13px;margin:0 0 8px}
.ftr{text-align:center;color:#5b6570;font-size:12px;padding:16px}
@media (max-width:640px){.row>label{flex-basis:100%;text-align:left;padding-top:0}.hdr{padding:0 12px}.wrap{padding-top:24px}}
.dark{background:#16191d;color:#dfe2e6}
.dark a{color:#6aa8ff}
.dark .sec{background:#1e2227;border-color:#343a41}
.dark .sec h3,.dark .foot{background:#252a30;border-color:#343a41;color:#cfd4da}
.dark .desc,.dark .hint,.dark .note,.dark .ftr{color:#9aa3ad}
.dark .row>label{color:#c4cad1}
.dark input{background:#14171a;border-color:#454c54;color:#dfe2e6}
.dark .btn.apply{background:#3d8bfd;border-color:#3d8bfd;color:#0d1117}
.hl .hdr{background:#fff;color:#1d2125;border-bottom:1px solid #d5d9de}
.hl .brand,.hl .brand:hover{color:#1d2125}
.hn .hdr{background:#0f2d4f}
.dark.hl .hdr{background:#1e2227;color:#dfe2e6;border-color:#343a41}
.dark.hl .brand{color:#fff}
</style>
</helmet>
<div class="{{theme}}">
<header class="hdr">
<a class="brand" href="Login.dc.html"><img src="logo.svg" alt="" width="24" height="24">Nodo</a>
</header>
<main class="wrap">
<h2>Authorization required</h2>
<p class="desc">Log in to your Nodo.</p>
<form class="sec" action="Main.dc.html">
<h3>Log in</h3>
<div class="body">
<div class="row">
<label for="pass">Device passphrase</label>
<div class="fld"><input id="pass" type="password" autocomplete="current-password">
<div class="hint">It is the passphrase that unlocks this Nodo after a restart. Logging in also unlocks it.</div></div>
</div>
</div>
<div class="foot"><a class="btn apply" href="Main.dc.html" style="display: inline-flex; align-items: center">Log in</a></div>
</form>
<p class="note">A lost passphrase can't be recovered; a backup brings the data back.</p>
</main>
<footer class="ftr">nodo.local · Nodo web GUI</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"header":{"editor":"enum","options":["Light","Charcoal","Navy"],"default":"Light"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const h = { Light: ' hl', Navy: ' hn', Charcoal: '' }[this.props.header ?? 'Light'] ?? ' hl';
return { theme: 'root' + (this.props.dark ? ' dark' : '') + h };
}
}
</script>
</body>
</html>
