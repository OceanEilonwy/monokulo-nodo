<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nodo device — Unlock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.dev{width:960px;height:540px;background:#000;color:#f2f2f2;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;gap:12px;padding:16px;overflow:hidden;box-sizing:border-box}
.btn{height:56px;padding:0 26px;border-radius:16px;background:#1a1a1a;color:#f2f2f2;border:0;font:600 18px Inter,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.btn.pri{background:#ff6600;color:#000000}
.s{font-size:15px;color:#b3b3b3;line-height:20px}
.fld{flex:1 1 auto;min-width:0;height:64px;border-radius:16px;background:#0d0d0d;box-shadow:inset 0 0 0 2px #ff6600;padding:0 18px;box-sizing:border-box;display:flex;align-items:center;gap:12px}
.dots{font:700 26px "JetBrains Mono",monospace;letter-spacing:0.12em;white-space:nowrap;overflow:hidden;flex:1 1 auto}
.caret{display:inline-block;width:3px;height:28px;background:#ff6600;vertical-align:-4px;margin-left:2px}
.eye{width:48px;height:48px;border-radius:12px;border:0;background:#1a1a1a;color:#d9d9d9;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.eye svg{width:24px;height:24px}
.kb{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;flex:1 1 auto}
.k{height:58px;border-radius:14px;background:#1c1c1c;color:#f2f2f2;border:0;font:500 24px Inter,system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.k:active{background:#4c4c4c}
.k.fn{background:#0d0d0d;font-size:18px;font-weight:600;color:#d9d9d9}
.k.on{background:#ff6600;color:#000000}
.k svg{width:26px;height:26px}
</style>
</helmet>
<div class="dev">
<div style="display: flex; align-items: center; gap: 14px">
<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#ff8c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<div style="flex: 1 1 auto"><div style="font-size: 26px; font-weight: 700; line-height: 32px">Unlock your Nodo</div><div class="s">2 services keep their storage encrypted until you enter the device passphrase.</div></div>
</div>
<div style="display: flex; gap: 12px; align-items: center">
<div class="fld" role="textbox" aria-label="Device passphrase">
<span class="dots">{{shown}}<span class="caret"></span></span>
<button class="eye" type="button" aria-label="{{eyeLabel}}" aria-pressed="{{reveal}}" onClick="{{toggleReveal}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
<a class="btn" href="Glance.dc.html">Leave it locked</a>
<a class="btn pri" href="Main.dc.html">Unlock</a>
</div>
<div class="kb">
<sc-for list="{{keys}}" as="key" hint-placeholder-count="40">
<button class="k" type="button" onClick="{{key.press}}">{{key.label}}</button>
</sc-for>
<button class="{{shiftCls}}" type="button" aria-label="Shift" aria-pressed="{{shift}}" onClick="{{toggleShift}}" style="grid-column: span 2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l8 8h-4v7H8v-7H4z"></path></svg></button>
<button class="k fn" type="button" onClick="{{symbols}}">#+=</button>
<button class="k fn" type="button" onClick="{{space}}" style="grid-column: span 5">space</button>
<button class="k fn" type="button" aria-label="Delete" onClick="{{back}}" style="grid-column: span 2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"></path><path d="M17 9l-6 6"></path><path d="M11 9l6 6"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { value: 'correct-horse', shift: false, reveal: false };
}
renderVals() {
const s = this.state;
const rows = '1234567890qwertyuiopasdfghjkl-zxcvbnm.,!';
const keys = rows.split('').map((c) => {
const label = s.shift ? c.toUpperCase() : c;
return { label: label, press: () => this.setState({ value: s.value + label, shift: false }) };
});
return {
shown: s.reveal ? s.value : '•'.repeat(s.value.length),
reveal: s.reveal,
eyeLabel: s.reveal ? 'Hide passphrase' : 'Show passphrase',
toggleReveal: () => this.setState({ reveal: !s.reveal }),
keys: keys,
shift: s.shift,
shiftCls: s.shift ? 'k fn on' : 'k fn',
toggleShift: () => this.setState({ shift: !s.shift }),
symbols: () => this.setState({ value: s.value + '#' }),
space: () => this.setState({ value: s.value + ' ' }),
back: () => this.setState({ value: s.value.slice(0, -1) })
};
}
}
</script>
</body>
</html>
