api_version = 1
id = "library"
version = "@VERSION@"
# bin/library is a small launcher that turns the settings into the Library's own environment
# variables and puts its data in the data directory, then executes libexec/library.
exec = [
    "bin/library",
    # Visitors arrive through the appliance's proxy. Links are relative, so any address works.
    "--listen", "127.0.0.1:8790",
]
settings = "settings.lua"
# SQLite in WAL mode; a stop finishes the request in hand and the background indexer's batch.
stop_timeout_secs = 15
health = { http = { url = "http://127.0.0.1:8790/healthz" } }

[storage]
# The catalogue, lending history (borrowers' names), photos, the search model, and the Player's
# accounts (names, email addresses), playlists and digital copies.
encrypted = true
# Digital copies are what fills it: an album ripped to FLAC is about 300 MB, a DVD film 4 to 8 GB.
# Photos are stored resized (about 300 KB each) and the model is about 130 MB. The volume is
# allocated in full up front, so this is room for a family's ripped CDs and a few films
# rather than a whole film collection; an update can grow it, never shrink it.
size_mib = 16384
# 2: this version adds accounts, digital copies, playlists and favourites to the database (schema
# version 2) on its first start. The previous version would open that database without noticing,
# so the device keeps a copy of the old data for a rollback and never starts the old version on it.
data_layout = 2

[network]
# Looking items up while adding them (Open Library, Google Books, MusicBrainz, TMDb, a barcode
# database), fetching chosen covers, the upload studio's track details from MusicBrainz, and the
# meaning-search model's one-time download from Hugging Face. Each can be switched off in the
# settings; the catalogue works without them.
outbound = "internet"

[[web]]
name = "web"
upstream = "127.0.0.1:8790"
suggested_subdomain = "library"
# Every link is relative, and the Player at /player/ names only paths, never a host, so the site
# answers on any address it is given. Opened over plain HTTP the Player still plays, but its offline
# downloads need HTTPS (service workers). A digital copy is uploaded as one request however large,
# which the proxy allows since it sets no body limit.
multi_address = true
