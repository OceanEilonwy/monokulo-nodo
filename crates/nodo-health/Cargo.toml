[package]
name = "nodo-health"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Disk, log, memory and time health checks and protection for monokulo-nodo"

[[bin]]
name = "nodo-healthd"
path = "src/bin/nodo-healthd.rs"

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
serde_json = "1"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
